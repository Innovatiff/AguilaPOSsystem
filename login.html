<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Catálogo Águila</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/base.css">
  <script type="module" src="js/login.js"></script>
</head>
<body class="pagina-login">
  <main class="tarjeta-login">
    <h1><strong>Catálogo Águila</strong></h1>
    <p class="subtitulo">Águila Marketplace · acceso del personal</p>

    <p id="mensaje" class="mensaje" role="status" aria-live="polite" hidden></p>

    <form id="form-login" class="formulario" novalidate>
      <div class="campo">
        <label for="correo">Correo</label>
        <input id="correo" name="correo" type="email" autocomplete="username" required autofocus>
      </div>
      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required minlength="6">
      </div>
      <div class="acciones">
        <button id="btn-entrar" class="boton" type="submit">Entrar</button>
        <button id="btn-olvide" class="boton boton--enlace" type="button">Olvidé mi contraseña</button>
      </div>
    </form>
  </main>
</body>
</html>
