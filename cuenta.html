<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi cuenta · Catálogo Águila</title>
  <link rel="icon" href="icons/icono-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icono-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2b2b2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Catálogo Águila">
  <script type="module" src="js/pwa.js"></script>
  <link rel="stylesheet" href="css/base.css">
  <script type="module" src="js/cuenta.js"></script>
</head>
<body>
  <header id="navegacion" class="encabezado"></header>
  <main id="contenido" class="contenido--angosto" hidden>
    <h1>Mi cuenta</h1>

    <dl id="datos-cuenta" class="ficha"></dl>

    <section class="seccion" aria-labelledby="titulo-secreto">
      <h2 id="titulo-secreto">Cambiar NIP</h2>
      <p id="nota-secreto" class="nota"></p>
      <form id="form-secreto" class="formulario formulario--columna" novalidate>
        <div class="campo">
          <label for="s-actual" id="et-actual">NIP actual</label>
          <input id="s-actual" type="password" autocomplete="current-password" required>
        </div>
        <div class="campo">
          <label for="s-nuevo" id="et-nuevo">NIP nuevo</label>
          <input id="s-nuevo" type="password" autocomplete="new-password" required>
        </div>
        <div class="campo">
          <label for="s-repetir" id="et-repetir">Repite el NIP nuevo</label>
          <input id="s-repetir" type="password" autocomplete="new-password" required>
        </div>
        <p id="s-mensaje" class="mensaje" role="status" aria-live="polite" hidden></p>
        <div class="acciones">
          <button id="s-guardar" class="boton" type="submit">Guardar</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
